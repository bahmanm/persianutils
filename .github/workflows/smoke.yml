name: smoke

on:
  push:
    branches:
      - "master"
      - "main"
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    branches:
      - "master"
      - "main"
    paths-ignore:
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    name: smoke__jdk-${{ matrix.java }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -euo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        java:
          - "17"
          - "21"
          - "25"

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
          cache: "sbt"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Compile smoke tests
        run: sbt 'smokeTestCompile'

      - name: Run smoke tests
        run: sbt 'smokeTest'
