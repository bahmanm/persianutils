name: pages

on:
  push:
    branches:
      - "main"
      - "master"
    paths:
      - "docs/**"
      - "src/**"
      - "build.sbt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages__build:
    name: Build site and API documentation
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "sbt"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Generate Scaladoc
        run: sbt '+ persianutilsJVM/Compile/doc'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install documentation dependencies
        run: |
          cd docs
          bundle install

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build Jekyll documentation
        run: |
          cd docs
          bundle exec jekyll build --destination ../_site

      - name: Assemble Scaladoc into site artifact
        run: |
          mkdir -p _site/api/scala-3
          mkdir -p _site/api/scala-2.13

          scala3_api="$(find .jvm/target -maxdepth 3 -type d -name "api" -path "*/scala-3*/*" | head -n 1)"
          if [[ -z "$scala3_api" || ! -d "$scala3_api" ]]; then
            echo "ERROR: Unable to locate Scala 3 Scaladoc directory under .jvm/target" >&2
            exit 1
          fi
          echo "Found Scala 3 Scaladoc at: $scala3_api"
          cp -r "$scala3_api"/* _site/api/scala-3/

          scala2_api="$(find .jvm/target -maxdepth 3 -type d -name "api" -path "*/scala-2.13*/*" | head -n 1)"
          if [[ -z "$scala2_api" || ! -d "$scala2_api" ]]; then
            echo "ERROR: Unable to locate Scala 2.13 Scaladoc directory under .jvm/target" >&2
            exit 1
          fi
          echo "Found Scala 2.13 Scaladoc at: $scala2_api"
          cp -r "$scala2_api"/* _site/api/scala-2.13/

          cp docs/CNAME _site/CNAME

          cat <<'EOF' > _site/api/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>persianutils API Documentation</title>
            <meta http-equiv="refresh" content="0; url=./scala-3/index.html">
            <link rel="canonical" href="./scala-3/index.html">
          </head>
          <body>
            <p>Redirecting to <a href="./scala-3/index.html">Scala 3 API Documentation</a>...</p>
            <p>Looking for Scala 2.13? Visit <a href="./scala-2.13/index.html">Scala 2.13 API Documentation</a>.</p>
          </body>
          </html>
          EOF

      - name: Verify site build
        run: |
          for file in _site/index.html _site/CNAME _site/api/index.html _site/api/scala-3/index.html _site/api/scala-2.13/index.html; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Missing required artifact: $file" >&2
              exit 1
            fi
            echo "Verified artifact: $file"
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  pages__deploy:
    name: Deploy to GitHub Pages
    needs: pages__build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
